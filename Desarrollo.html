
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Encuentra el sol · Desarrollo · Prof. Miguel Ubiera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b1a2e 0%, #0f212f 100%);
            min-height: 100vh;
            padding: 12px;
            position: relative;
        }

        .back-arrow {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(255, 248, 225, 0.85);
            backdrop-filter: blur(6px);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #1a5f82;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: 0.2s;
            z-index: 400;
            border: 1px solid #ecd9b4;
        }
        .back-arrow:hover {
            background: #fef0cf;
            transform: scale(1.05);
            color: #c0672c;
        }

        .timer {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(10, 42, 50, 0.75);
            backdrop-filter: blur(6px);
            color: #fef0cf;
            padding: 4px 10px;
            border-radius: 50px;
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 300;
            pointer-events: none;
        }

        .slide-card {
            max-width: 1200px;
            margin: 0 auto;
            background: #fefaf2;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 40px rgba(0,0,0,0.35);
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            background: #fefcf5;
        }

        .left-panel {
            flex: 1;
            min-width: 250px;
            background: #fffbf0;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-right: 2px solid #ecd9b4;
        }

        .right-canvas {
            flex: 2;
            background: #fef7ea;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            padding: 6px;
            border: 1px solid #e0cdb0;
            width: 100%;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #fff;
            width: 100%;
            height: auto;
            cursor: crosshair;
            max-width: 700px;
        }

        .titulo-mini {
            text-align: left;
            margin-left: 5px;
        }
        .titulo-mini h1 {
            font-size: 1.2rem;
            color: #1a5f82;
            font-weight: 800;
            margin-bottom: 2px;
            display: inline-block;
            background: rgba(255,248,200,0.6);
            padding: 0 12px;
            border-radius: 40px;
        }
        .prof-info {
            font-size: 0.7rem;
            font-weight: bold;
            text-align: left;
            color: #c0672c;
            background: rgba(255,248,200,0.6);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 30px;
            margin-top: 4px;
            white-space: nowrap;
        }

        .ecuacion-card {
            background: #0f2f3f;
            border-radius: 28px;
            padding: 10px 8px;
            text-align: center;
        }
        .ecuacion {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #ffe6b3;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
        }
        .frac .num {
            font-size: 0.9rem;
            border-bottom: 2px solid #ffd966;
            line-height: 1.2;
            padding-bottom: 2px;
        }
        .frac .den {
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .step-info {
            background: #e9e2d4;
            border-radius: 28px;
            padding: 8px 12px;
            text-align: center;
        }
        .step-info p {
            font-weight: 600;
            color: #2c5a6e;
            font-size: 0.75rem;
        }
        .step-detail {
            font-size: 0.85rem;
            font-weight: bold;
            color: #c0672c;
            margin-top: 3px;
        }

        .formula-fija {
            background: #f5e6d3;
            border-radius: 28px;
            padding: 6px 10px;
            text-align: center;
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: bold;
            color: #1e5a6e;
            border: 1px solid #dcc89e;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }
        .btn {
            background: #e9e2d4;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-primary {
            background: #ffb347;
            color: #2c3e2f;
        }
        .btn-outline {
            background: #d9d2c4;
        }
        .progreso {
            background: #e3d7c4;
            border-radius: 30px;
            padding: 4px 10px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        @media (max-width: 780px) {
            .dashboard { flex-direction: column; }
            .left-panel { border-right: none; border-bottom: 2px solid #ecd9b4; }
            .prof-info { white-space: normal; }
        }
    </style>
</head>
<body>
<a href="index.html" class="back-arrow" aria-label="Volver al inicio">←</a>
<div class="timer" id="cronometro">00:00:00</div>

<div class="slide-card">
    <div class="dashboard">
        <div class="left-panel">
            <div class="titulo-mini">
                <h1>🌌 ENCUENTRA EL SOL</h1>
                <div class="prof-info">Profesor Miguel Ubiera · Geometría Analítica · Modelo orbital</div>
            </div>
            <div class="ecuacion-card">
                <div class="ecuacion" id="ecuacionDisplay"></div>
            </div>
            <div class="step-info">
                <p>📌 <strong>Paso actual</strong></p>
                <div class="step-detail" id="stepTexto">Ecuación</div>
            </div>
            <div class="formula-fija">
                📐 F² = a² – b²
            </div>
            <div class="nav-buttons">
                <button id="btnSiguiente" class="btn btn-primary">▶ Siguiente paso</button>
                <button id="btnResetEjemplo" class="btn btn-outline">🔄 Reiniciar</button>
            </div>
            <div class="progreso" id="progresoEjemplo">Ejemplo 1 de 3</div>
        </div>
        <div class="right-canvas">
            <div class="canvas-container">
                <canvas id="ellipseCanvas" width="750" height="600" style="width:100%; height:auto; max-width:700px; aspect-ratio:5/4"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ========== CRONÓMETRO ==========
        let startTime = Date.now();
        let timerInterval = null;
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let hours = Math.floor(totalSec / 3600);
            let minutes = Math.floor((totalSec % 3600) / 60);
            let seconds = totalSec % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const timerDiv = document.getElementById('cronometro');
            if (timerDiv) timerDiv.innerText = formatTime(elapsed);
        }
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }
        startTimer();

        // ========== EJEMPLOS (focos enteros) ==========
        const ejemplos = [
            { nombre: "Ejemplo 1", h: 2, k: 1, a: 10, b: 8, aCuad: 100, bCuad: 64, c: 6, cCuad: 36 },
            { nombre: "Ejemplo 2", h: 1, k: 2, a: 5, b: 4, aCuad: 25, bCuad: 16, c: 3, cCuad: 9 },
            { nombre: "Ejemplo 3", h: -1, k: 1, a: 10, b: 6, aCuad: 100, bCuad: 36, c: 8, cCuad: 64 }
        ];

        let currentEjemploIdx = 0;
        let currentStep = 0;
        let animActive = false;
        let animationId = null;
        let orbitAngle = 0;

        const canvas = document.getElementById('ellipseCanvas');
        const ctx = canvas.getContext('2d');
        const ecuacionDiv = document.getElementById('ecuacionDisplay');
        const stepTextoDiv = document.getElementById('stepTexto');
        const progresoDiv = document.getElementById('progresoEjemplo');
        const btnSiguiente = document.getElementById('btnSiguiente');
        const btnReset = document.getElementById('btnResetEjemplo');

        let canvasWidth = 750, canvasHeight = 600;
        const xMin = -15, xMax = 15;
        const yMin = -10, yMax = 10;

        function worldToCanvas(x, y) {
            const px = ((x - xMin) / (xMax - xMin)) * canvasWidth;
            const py = canvasHeight - ((y - yMin) / (yMax - yMin)) * canvasHeight;
            return { x: px, y: py };
        }

        function drawGridAndAxes() {
            ctx.save();
            ctx.strokeStyle = "#8aacc9";
            ctx.lineWidth = 0.6;
            ctx.globalAlpha = 0.75;
            for (let x = -15; x <= 15; x++) {
                const { x: px } = worldToCanvas(x, 0);
                const { y: py0 } = worldToCanvas(0, yMin);
                const { y: py1 } = worldToCanvas(0, yMax);
                ctx.beginPath();
                ctx.moveTo(px, py0);
                ctx.lineTo(px, py1);
                ctx.stroke();
            }
            for (let y = -10; y <= 10; y++) {
                const { x: px0 } = worldToCanvas(xMin, 0);
                const { x: px1 } = worldToCanvas(xMax, 0);
                const { y: py } = worldToCanvas(0, y);
                ctx.beginPath();
                ctx.moveTo(px0, py);
                ctx.lineTo(px1, py);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            const origin = worldToCanvas(0, 0);
            const xRight = worldToCanvas(xMax, 0);
            const xLeft = worldToCanvas(xMin, 0);
            const yUp = worldToCanvas(0, yMax);
            const yDown = worldToCanvas(0, yMin);
            ctx.beginPath();
            ctx.moveTo(xLeft.x, xLeft.y);
            ctx.lineTo(xRight.x, xRight.y);
            ctx.moveTo(origin.x, yUp.y);
            ctx.lineTo(origin.x, yDown.y);
            ctx.strokeStyle = "#1a3f5c";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = "#1a3f5c";
            const arrowX = worldToCanvas(xMax - 0.8, 0);
            ctx.beginPath();
            ctx.moveTo(arrowX.x, arrowX.y);
            ctx.lineTo(arrowX.x - 8, arrowX.y - 4);
            ctx.lineTo(arrowX.x - 8, arrowX.y + 4);
            ctx.fill();
            const arrowY = worldToCanvas(0, yMax - 0.8);
            ctx.beginPath();
            ctx.moveTo(arrowY.x, arrowY.y);
            ctx.lineTo(arrowY.x - 4, arrowY.y + 8);
            ctx.lineTo(arrowY.x + 4, arrowY.y + 8);
            ctx.fill();

            ctx.font = "bold 11px 'Segoe UI'";
            ctx.fillStyle = "#0f5c7a";
            const labelX = worldToCanvas(xMax - 0.8, -0.4);
            ctx.fillText("X", labelX.x, labelX.y);
            const labelY = worldToCanvas(0.5, yMax - 0.8);
            ctx.fillText("Y", labelY.x, labelY.y);

            ctx.font = "8px 'Courier New', monospace";
            ctx.fillStyle = "#1a5c7e";
            for (let x = -15; x <= 15; x += 1) {
                if (Math.abs(x) < 0.1) continue;
                const { x: px, y: py } = worldToCanvas(x, 0);
                ctx.fillText(x.toString(), px - 4, py - 4);
            }
            const zero = worldToCanvas(0, 0);
            ctx.fillStyle = "#1a5c7e";
            ctx.fillText("0", zero.x - 7, zero.y + 4);
            for (let y = -10; y <= 10; y += 1) {
                if (Math.abs(y) < 0.1) continue;
                const { x: px, y: py } = worldToCanvas(0, y);
                ctx.fillText(y.toString(), px + 5, py + 3);
            }
            ctx.restore();
        }

        function drawEllipse(h, k, a, b) {
            ctx.beginPath();
            const steps = 200;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * 2 * Math.PI;
                const x = h + a * Math.cos(t);
                const y = k + b * Math.sin(t);
                const { x: px, y: py } = worldToCanvas(x, y);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = "#bc3f1a";
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.strokeStyle = "#e67e22";
            ctx.lineWidth = 1.4;
            ctx.stroke();
        }

        function drawCenter(h, k) {
            const { x: cx, y: cy } = worldToCanvas(h, k);
            ctx.beginPath();
            ctx.arc(cx, cy, 7, 0, 2 * Math.PI);
            ctx.fillStyle = "#2c7da0";
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(cx, cy, 2.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = "#1e3a5f";
            ctx.font = "bold 9px monospace";
            ctx.fillText("Centro", cx + 9, cy - 4);
        }

        function drawPlanet(angleRad, h, k, a, b) {
            const x = h + a * Math.cos(angleRad);
            const y = k + b * Math.sin(angleRad);
            const { x: px, y: py } = worldToCanvas(x, y);
            ctx.beginPath();
            ctx.arc(px, py, 26, 0, 2 * Math.PI);
            ctx.fillStyle = "#f39c12";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px, py, 12, 0, 2 * Math.PI);
            ctx.fillStyle = "#e67e22";
            ctx.fill();
            ctx.font = "bold 32px 'Segoe UI'";
            ctx.fillStyle = "#2c3e50";
            ctx.fillText("🌍", px - 17, py - 17);
        }

        function drawFociAndSun(h, k, a, b, c) {
            const major = (a >= b) ? 'horizontal' : 'vertical';
            let focos = [];
            if (major === 'horizontal') {
                focos = [{ x: h - c, y: k }, { x: h + c, y: k }];
            } else {
                focos = [{ x: h, y: k - c }, { x: h, y: k + c }];
            }
            focos.forEach(f => {
                const { x: fx, y: fy } = worldToCanvas(f.x, f.y);
                ctx.beginPath();
                ctx.arc(fx, fy, 6, 0, 2 * Math.PI);
                ctx.fillStyle = "#5d6d7e";
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(fx, fy, 2.5, 0, 2 * Math.PI);
                ctx.fill();
            });
            let solX, solY;
            if (major === 'horizontal') {
                solX = h + c;
                solY = k;
            } else {
                solX = h;
                solY = k + c;
            }
            const { x: sx, y: sy } = worldToCanvas(solX, solY);
            ctx.beginPath();
            ctx.arc(sx, sy, 24, 0, 2 * Math.PI);
            ctx.fillStyle = "#fdbe02";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx, sy, 12, 0, 2 * Math.PI);
            ctx.fillStyle = "#ff9500";
            ctx.fill();
            ctx.font = "bold 24px 'Segoe UI'";
            ctx.fillStyle = "white";
            ctx.fillText("☀️", sx - 14, sy - 12);
        }

        function drawDashedLines(h, k) {
            ctx.save();
            ctx.setLineDash([5, 7]);
            ctx.lineWidth = 1.3;
            ctx.strokeStyle = "#e68a3e";
            ctx.globalAlpha = 0.8;
            const left = worldToCanvas(xMin, k);
            const right = worldToCanvas(xMax, k);
            ctx.beginPath();
            ctx.moveTo(left.x, left.y);
            ctx.lineTo(right.x, right.y);
            ctx.stroke();
            const top = worldToCanvas(h, yMax);
            const bottom = worldToCanvas(h, yMin);
            ctx.beginPath();
            ctx.moveTo(top.x, top.y);
            ctx.lineTo(bottom.x, bottom.y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function renderCanvas() {
            const ej = ejemplos[currentEjemploIdx];
            const { h, k, a, b, c } = ej;
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawGridAndAxes();

            if (currentStep >= 2) drawEllipse(h, k, a, b);
            if (currentStep >= 1) {
                drawDashedLines(h, k);
                drawCenter(h, k);
            }
            if (currentStep >= 3) drawPlanet(orbitAngle, h, k, a, b);
            if (currentStep >= 5) drawFociAndSun(h, k, a, b, c);
        }

        // Ecuación con denominadores numéricos (a², b² mostrados como 100, 64, etc.)
        function updateEquationDisplay() {
            const ej = ejemplos[currentEjemploIdx];
            const { h, k, aCuad, bCuad } = ej;
            let signX = h >= 0 ? '-' : '+';
            let signY = k >= 0 ? '-' : '+';
            ecuacionDiv.innerHTML = `
                <div class="frac"><span class="num">(x ${signX} ${Math.abs(h)})²</span><span class="den">${aCuad}</span></div>
                <span>+</span>
                <div class="frac"><span class="num">(y ${signY} ${Math.abs(k)})²</span><span class="den">${bCuad}</span></div>
                <span>= 1</span>
            `;
        }

        function updateStepText() {
            const ej = ejemplos[currentEjemploIdx];
            switch (currentStep) {
                case 0: stepTextoDiv.innerText = "📄 Ecuación canónica"; break;
                case 1: stepTextoDiv.innerText = `🎯 Centro (${ej.h}, ${ej.k})`; break;
                case 2: stepTextoDiv.innerText = "📈 Gráfica de la elipse"; break;
                case 3: stepTextoDiv.innerText = "🌍 Planeta orbitando"; break;
                case 4: stepTextoDiv.innerText = `📐 F² = a² − b² = ${ej.aCuad} − ${ej.bCuad} = ${ej.cCuad}   →   F = ${ej.c}`; break;
                case 5: stepTextoDiv.innerText = "⭐ El SOL está en un foco"; break;
                default: stepTextoDiv.innerText = "";
            }
        }

        function stopAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            animActive = false;
            orbitAngle = 0;
        }

        function startOrbitAnimation() {
            if (animActive) return;
            animActive = true;
            function animate() {
                if (!animActive) return;
                orbitAngle += 0.012;
                if (orbitAngle > 2 * Math.PI) orbitAngle -= 2 * Math.PI;
                renderCanvas();
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function loadStep() {
            stopAnimation();
            if (currentStep >= 3 && currentStep < 5) startOrbitAnimation();
            else if (currentStep === 5) startOrbitAnimation();
            else {
                orbitAngle = 0;
                renderCanvas();
            }
            updateEquationDisplay();
            updateStepText();
            renderCanvas();
        }

        function nextStep() {
            const maxSteps = 5;
            if (currentStep < maxSteps) {
                currentStep++;
                loadStep();
            } else {
                if (currentEjemploIdx + 1 < ejemplos.length) {
                    currentEjemploIdx++;
                    currentStep = 0;
                    progresoDiv.innerText = `Ejemplo ${currentEjemploIdx + 1} de ${ejemplos.length}`;
                    loadStep();
                } else {
                    stepTextoDiv.innerText = "🎉 ¡Ejemplos completados! 🎉";
                    btnSiguiente.disabled = true;
                    stopAnimation();
                    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                    drawGridAndAxes();
                    ctx.font = "bold 18px 'Segoe UI'";
                    ctx.fillStyle = "#2c6e2f";
                    ctx.fillText("✨ Muy bien, felicidades ✨", canvasWidth / 2 - 140, canvasHeight - 40);
                }
            }
        }

        function resetCompletely() {
            stopAnimation();
            currentEjemploIdx = 0;
            currentStep = 0;
            orbitAngle = 0;
            progresoDiv.innerText = `Ejemplo 1 de ${ejemplos.length}`;
            loadStep();
            btnSiguiente.disabled = false;
        }

        btnSiguiente.addEventListener('click', nextStep);
        btnReset.addEventListener('click', resetCompletely);

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvasWidth = container.clientWidth;
            canvasHeight = Math.min(550, canvasWidth * 0.8);
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            loadStep();
        }
        window.addEventListener('resize', () => setTimeout(resizeCanvas, 100));
        resizeCanvas();
        progresoDiv.innerText = `Ejemplo 1 de ${ejemplos.length}`;
        loadStep();
    })();
</script>
</body>
</html>
